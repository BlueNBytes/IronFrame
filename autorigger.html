<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRONFRAME // 3D Model Rigger & Animator</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0f0e;
            color: #00ff66;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0b0f0e;
        }

        ::-webkit-scrollbar-thumb {
            background: #1a3322;
            border: 1px solid #00ff66;
        }

        .cyber-border {
            border: 1px solid #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.15);
        }

        .cyber-button {
            background: #112216;
            border: 1px solid #00ff66;
            color: #00ff66;
            transition: all 0.2s;
        }

        .cyber-button:hover {
            background: #00ff66;
            color: #0b0f0e;
            box-shadow: 0 0 15px #00ff66;
        }

        .cyber-input {
            background: #050a07;
            border: 1px solid #1a4d2e;
            color: #00ff66;
        }

        .cyber-input:focus {
            border-color: #00ff66;
            outline: none;
            box-shadow: 0 0 5px #00ff66;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-[#050a07] border-b border-[#1a4d2e] px-4 py-3 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <span class="inline-block w-3 h-3 bg-[#00ff66] animate-pulse"></span>
            <h1 class="text-lg font-bold tracking-wider text-[#00ff66]">IRONFRAME // RIGGER & ANIMATOR</h1>
        </div>
        <div class="flex items-center space-x-3">
            <label
                class="cyber-button px-3 py-1.5 text-xs font-bold uppercase cursor-pointer flex items-center space-x-1">
                <span>📁 Load .GLB</span>
                <input type="file" id="glb-file-input" accept=".glb,.gltf" class="hidden">
            </label>
            <button id="btn-export-glb" class="cyber-button px-3 py-1.5 text-xs font-bold uppercase">💾 Export
                .GLB</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Sidebar: Scene & Hierarchy / Bones -->
        <div class="w-80 bg-[#070e0a] border-r border-[#1a4d2e] flex flex-col z-10">
            <div
                class="p-3 border-b border-[#1a4d2e] bg-[#0b1410] font-bold text-xs tracking-wider flex justify-between items-center">
                <span>SKELETON & HIERARCHY</span>
                <button id="btn-add-bone"
                    class="text-[10px] bg-[#112216] border border-[#00ff66] px-2 py-0.5 hover:bg-[#00ff66] hover:text-[#0b0f0e]">➕
                    ADD BONE</button>
            </div>
            <div id="hierarchy-tree" class="flex-1 overflow-y-auto p-3 space-y-1 text-xs">
                <!-- Populated dynamically -->
                <div class="text-zinc-500 italic">No model loaded. Load a .GLB file to inspect or add bones.</div>
            </div>
            <div id="bone-properties" class="p-3 border-t border-[#1a4d2e] bg-[#070e0a] text-xs space-y-2 hidden">
                <div class="font-bold text-[#00ff66] pb-1 border-b border-[#1a4d2e]" id="selected-bone-name">Bone: Root
                </div>
                <div class="grid grid-cols-3 gap-1 text-[10px]">
                    <div>
                        <span class="text-zinc-400 block">ROT X</span>
                        <input type="range" id="rot-x" min="-3.14" max="3.14" step="0.01" value="0"
                            class="w-full accent-[#00ff66]">
                    </div>
                    <div>
                        <span class="text-zinc-400 block">ROT Y</span>
                        <input type="range" id="rot-y" min="-3.14" max="3.14" step="0.01" value="0"
                            class="w-full accent-[#00ff66]">
                    </div>
                    <div>
                        <span class="text-zinc-400 block">ROT Z</span>
                        <input type="range" id="rot-z" min="-3.14" max="3.14" step="0.01" value="0"
                            class="w-full accent-[#00ff66]">
                    </div>
                </div>
            </div>
        </div>

        <!-- Center 3D Viewport -->
        <div class="flex-1 relative bg-[#050806]" id="canvas-container">
            <div id="status-overlay"
                class="absolute top-3 left-3 bg-[#070e0a]/90 cyber-border px-3 py-1.5 text-xs text-[#00ff66] pointer-events-none z-10">
                STATUS: READY. LOAD A .GLB TO BEGIN.
            </div>
        </div>

        <!-- Right Sidebar: Animation Timeline -->
        <div class="w-72 bg-[#070e0a] border-l border-[#1a4d2e] flex flex-col z-10">
            <div class="p-3 border-b border-[#1a4d2e] bg-[#0b1410] font-bold text-xs tracking-wider">
                TIMELINE & KEYFRAMES
            </div>
            <div class="p-3 space-y-3 text-xs flex-1 overflow-y-auto">
                <div class="flex items-center justify-between">
                    <span class="text-zinc-400">Current Frame:</span>
                    <span id="current-frame-display" class="font-bold text-[#00ff66]">1 / 60</span>
                </div>
                <input type="range" id="timeline-scrubber" min="1" max="60" value="1" class="w-full accent-[#00ff66]">
                <div class="flex space-x-2">
                    <button id="btn-play" class="flex-1 cyber-button py-1.5 font-bold text-center">▶ PLAY</button>
                    <button id="btn-keyframe" class="flex-1 cyber-button py-1.5 font-bold text-center">⏺
                        KEYFRAME</button>
                </div>
                <div class="border-t border-[#1a4d2e] pt-3 mt-3">
                    <span class="text-zinc-400 block mb-1">Recorded Animation Clips:</span>
                    <div id="clip-list" class="space-y-1">
                        <div class="text-zinc-500 italic text-[11px]">No keyframes recorded yet.</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        let scene, camera, renderer, controls;
        let currentModel = null;
        let skeletonHelper = null;
        let selectedBone = null;
        let bonesList = [];
        let keyframes = {}; // { boneName: { frameNumber: { rotation: [x,y,z], position: [x,y,z] } } }
        let currentFrame = 1;
        let totalFrames = 60;
        let isPlaying = false;
        let playInterval = null;

        function showMessage(msg) {
            const el = document.getElementById('status-overlay');
            if (el) el.innerText = 'STATUS: ' + msg;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050806);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x00ff66, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Grid
            const grid = new THREE.GridHelper(20, 20, 0x00ff66, 0x1a4d2e);
            grid.position.y = -1;
            scene.add(grid);

            window.addEventListener('resize', onWindowResize);
            setupEventListeners();
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        // Auto-Fit Camera to Model Bounding Box
        function fitCameraToObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            let fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.8;

            camera.position.set(center.x + cameraZ * 0.5, center.y + cameraZ * 0.5, center.z + cameraZ * 1.5);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        // GLB Loading
        function setupEventListeners() {
            const fileInput = document.getElementById('glb-file-input');
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (event) {
                    const contents = event.target.result;
                    const loader = new THREE.GLTFLoader();
                    loader.parse(contents, '', (gltf) => {
                        if (currentModel) scene.remove(currentModel);
                        currentModel = gltf.scene;
                        scene.add(currentModel);

                        // Find Skeleton / Bones
                        bonesList = [];
                        currentModel.traverse((child) => {
                            if (child.isBone) bonesList.push(child);
                            if (child.isSkinnedMesh && !skeletonHelper) {
                                skeletonHelper = new THREE.SkeletonHelper(child);
                                scene.add(skeletonHelper);
                            }
                        });

                        // If no skeleton helper found via skinned mesh, check for bones directly
                        if (!skeletonHelper && bonesList.length > 0) {
                            skeletonHelper = new THREE.SkeletonHelper(currentModel);
                            scene.add(skeletonHelper);
                        }

                        fitCameraToObject(currentModel);
                        updateHierarchyTree();
                        showMessage("LOADED " + file.name + " (" + bonesList.length + " BONES DETECTED)");
                    }, (error) => {
                        console.error(error);
                        showMessage("ERROR PARSING GLB FILE");
                    });
                };
                reader.readAsArrayBuffer(file);
            });

            // Add Bone Button
            document.getElementById('btn-add-bone').addEventListener('click', () => {
                if (!currentModel) {
                    showMessage("LOAD A MODEL FIRST TO ADD BONES");
                    return;
                }

                let parentBone = selectedBone;
                if (!parentBone && bonesList.length > 0) parentBone = bonesList[0];

                const newBoneName = "Bone_" + (bonesList.length + 1);
                const newBone = new THREE.Bone();
                newBone.name = newBoneName;
                newBone.position.set(0, 0.5, 0);

                if (parentBone) {
                    parentBone.add(newBone);
                } else {
                    currentModel.add(newBone);
                }

                bonesList.push(newBone);

                if (skeletonHelper) {
                    scene.remove(skeletonHelper);
                }
                // Re-bind skeleton helper
                currentModel.traverse((child) => {
                    if (child.isSkinnedMesh) {
                        skeletonHelper = new THREE.SkeletonHelper(child);
                        scene.add(skeletonHelper);
                    }
                });
                if (!skeletonHelper) {
                    skeletonHelper = new THREE.SkeletonHelper(currentModel);
                    scene.add(skeletonHelper);
                }

                updateHierarchyTree();
                showMessage("ADDED BONE: " + newBoneName);
            });

            // Sliders for Bone Rotation
            ['rot-x', 'rot-y', 'rot-z'].forEach(id => {
                const slider = document.getElementById(id);
                slider.addEventListener('input', () => {
                    if (!selectedBone) return;
                    const rx = parseFloat(document.getElementById('rot-x').value);
                    const ry = parseFloat(document.getElementById('rot-y').value);
                    const rz = parseFloat(document.getElementById('rot-z').value);
                    selectedBone.rotation.set(rx, ry, rz);
                    if (skeletonHelper) skeletonHelper.update();
                });
            });

            // Keyframe Button
            document.getElementById('btn-keyframe').addEventListener('click', () => {
                if (!selectedBone) {
                    showMessage("SELECT A BONE TO KEYFRAME");
                    return;
                }
                if (!keyframes[selectedBone.name]) keyframes[selectedBone.name] = {};
                keyframes[selectedBone.name][currentFrame] = {
                    rotation: [selectedBone.rotation.x, selectedBone.rotation.y, selectedBone.rotation.z],
                    position: [selectedBone.position.x, selectedBone.position.y, selectedBone.position.z]
                };
                updateClipList();
                showMessage("RECORDED KEYFRAME FOR " + selectedBone.name + " AT FRAME " + currentFrame);
            });

            // Timeline Scrubber
            const scrubber = document.getElementById('timeline-scrubber');
            scrubber.addEventListener('input', (e) => {
                currentFrame = parseInt(e.target.value);
                document.getElementById('current-frame-display').innerText = currentFrame + ' / ' + totalFrames;
                applyKeyframesAtCurrentFrame();
            });

            // Play Button
            document.getElementById('btn-play').addEventListener('click', () => {
                if (isPlaying) {
                    clearInterval(playInterval);
                    isPlaying = false;
                    document.getElementById('btn-play').innerText = "▶ PLAY";
                } else {
                    isPlaying = true;
                    document.getElementById('btn-play').innerText = "⏸ PAUSE";
                    playInterval = setInterval(() => {
                        currentFrame = (currentFrame % totalFrames) + 1;
                        scrubber.value = currentFrame;
                        document.getElementById('current-frame-display').innerText = currentFrame + ' / ' + totalFrames;
                        applyKeyframesAtCurrentFrame();
                    }, 100);
                }
            });

            // Export GLB
            document.getElementById('btn-export-glb').addEventListener('click', () => {
                if (!currentModel) {
                    showMessage("NO MODEL TO EXPORT");
                    return;
                }

                // Build animation clips if any keyframes exist
                const tracks = [];
                for (const boneName in keyframes) {
                    let boneObj = null;
                    currentModel.traverse(c => { if (c.name === boneName) boneObj = c; });
                    if (!boneObj) continue;

                    const times = [];
                    const values = [];
                    for (const fStr in keyframes[boneName]) {
                        const f = parseInt(fStr);
                        times.push((f - 1) / 30); // 30 fps
                        const rot = keyframes[boneName][f].rotation;
                        // Convert Euler to Quaternion for track
                        const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rot[0], rot[1], rot[2]));
                        values.push(q.x, q.y, q.z, q.w);
                    }

                    if (times.length > 0) {
                        const trackName = boneObj.name + '.quaternion';
                        const track = new THREE.QuaternionKeyframeTrack(trackName, times, values);
                        tracks.push(track);
                    }
                }

                let animations = [];
                if (tracks.length > 0) {
                    animations.push(new THREE.AnimationClip('Action', 2.0, tracks));
                }

                const exporter = new THREE.GLTFExporter();
                exporter.parse(currentModel, (gltf) => {
                    const blob = new Blob([gltf], { type: 'application/octet-stream' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'rigged_animated_model.glb';
                    link.click();
                    showMessage("SUCCESSFULLY EXPORTED .GLB FILE!");
                }, (error) => {
                    console.error(error);
                    showMessage("EXPORT FAILED");
                }, { binary: true, animations: animations });
            });
        }

        function updateHierarchyTree() {
            const tree = document.getElementById('hierarchy-tree');
            tree.innerHTML = '';

            if (bonesList.length === 0) {
                tree.innerHTML = '<div class="text-zinc-500 italic">No bones detected in model. Click "➕ ADD BONE" to create a rig.</div>';
                return;
            }

            bonesList.forEach(bone => {
                const item = document.createElement('div');
                item.className = 'p-1.5 hover:bg-[#112216] cursor-pointer border border-transparent hover:border-[#00ff66] flex justify-between items-center';
                item.innerHTML = `<span>🦴 ${bone.name}</span><span class="text-[10px] text-zinc-500">Joint</span>`;
                item.addEventListener('click', () => {
                    selectedBone = bone;
                    document.getElementById('selected-bone-name').innerText = "Bone: " + bone.name;
                    document.getElementById('bone-properties').classList.remove('hidden');
                    document.getElementById('rot-x').value = bone.rotation.x;
                    document.getElementById('rot-y').value = bone.rotation.y;
                    document.getElementById('rot-z').value = bone.rotation.z;
                    showMessage("SELECTED BONE: " + bone.name);
                });
                tree.appendChild(item);
            });
        }

        function updateClipList() {
            const list = document.getElementById('clip-list');
            list.innerHTML = '';
            let count = 0;
            for (const b in keyframes) {
                for (const f in keyframes[b]) {
                    count++;
                    const div = document.createElement('div');
                    div.className = 'text-[11px] text-[#00ff66] bg-[#112216] px-2 py-1 border border-[#1a4d2e] flex justify-between';
                    div.innerHTML = `<span>${b} @ F${f}</span>`;
                    list.appendChild(div);
                }
            }
            if (count === 0) {
                list.innerHTML = '<div class="text-zinc-500 italic text-[11px]">No keyframes recorded yet.</div>';
            }
        }

        function applyKeyframesAtCurrentFrame() {
            for (const boneName in keyframes) {
                let boneObj = null;
                currentModel.traverse(c => { if (c.name === boneName) boneObj = c; });
                if (!boneObj) continue;

                const frames = Object.keys(keyframes[boneName]).map(Number).sort((a, b) => a - b);
                if (frames.length === 0) continue;

                // Find exact or interpolate
                let targetFrameData = null;
                if (keyframes[boneName][currentFrame]) {
                    targetFrameData = keyframes[boneName][currentFrame];
                } else {
                    // Find closest previous frame
                    let prevFrame = frames[0];
                    for (let f of frames) {
                        if (f <= currentFrame) prevFrame = f;
                    }
                    targetFrameData = keyframes[boneName][prevFrame];
                }

                if (targetFrameData) {
                    boneObj.rotation.set(...targetFrameData.rotation);
                    if (selectedBone === boneObj) {
                        document.getElementById('rot-x').value = boneObj.rotation.x;
                        document.getElementById('rot-y').value = boneObj.rotation.y;
                        document.getElementById('rot-z').value = boneObj.rotation.z;
                    }
                }
            }
            if (skeletonHelper) skeletonHelper.update();
        }

        window.addEventListener('DOMContentLoaded', init3D);
    </script>
</body>

</html>
